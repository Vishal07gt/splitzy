name: splitzy
description: "A split expense app built with Flutter + Supabase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # ── UI ──────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1        # avatar / profile images

  # ── STATE MANAGEMENT ────────────────────────────────────────
  flutter_riverpod: ^2.6.1            # core riverpod for flutter
  riverpod_annotation: ^2.6.1         # @riverpod annotation

  # ── NAVIGATION ──────────────────────────────────────────────
  go_router: ^17.1.0                  # routing + auth guard

  # ── BACKEND ─────────────────────────────────────────────────
  supabase_flutter: ^2.12.0           # supabase client + realtime + auth

  # ── FUNCTIONAL PROGRAMMING ──────────────────────────────────
  fpdart: ^1.2.0                      # Either, Option for error handling

  # ── UTILITIES ───────────────────────────────────────────────
  equatable: ^2.0.8                   # value equality for entities
  uuid: ^4.5.1                        # generate unique IDs client-side
  intl: ^0.20.2                       # date formatting, currency
  image_picker: ^1.1.2                # pick avatar image (profile)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── CODE GENERATION ─────────────────────────────────────────
  riverpod_generator: ^2.6.1          # generates providers from @riverpod
  build_runner: ^2.4.13               # runs code generation
  custom_lint: ^0.7.5                 # riverpod lint rules
  riverpod_lint: ^2.6.1               # catches riverpod mistakes early

flutter:
  uses-material-design: true