name: splitzy
description: "A split expense app built with Flutter + Supabase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # ── UI ──────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1        # avatar / profile images

  # ── STATE MANAGEMENT ────────────────────────────────────────
  flutter_bloc: ^9.1.0                # cubit + bloc
  get_it: ^8.0.3                      # service locator DI

  # ── NAVIGATION ──────────────────────────────────────────────
  go_router: ^17.1.0                  # routing + auth guard

  # ── BACKEND ─────────────────────────────────────────────────
  supabase_flutter: ^2.12.0           # supabase client + realtime + auth

  # ── FUNCTIONAL PROGRAMMING ──────────────────────────────────
  fpdart: ^1.2.0                      # Either, Option for error handling

  # ── UTILITIES ───────────────────────────────────────────────
  equatable: ^2.0.8                   # value equality for entities
  uuid: ^4.5.1                        # generate unique IDs client-side
  intl: ^0.20.2                       # date formatting, currency
  image_picker: ^1.1.2                # pick avatar image (profile)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4                # mocking for unit tests
  bloc_test: ^10.0.0              # cubit/bloc testing helpers


flutter:
  uses-material-design: true